# =====================================================================
# Cấu hình mặc định (production / GPU Linux)
# ---------------------------------------------------------------------
# Đây là cấu hình "đầy đủ" theo thiết kế đồ án (1e6 steps, 512 games/batch).
# Trên máy CPU yếu, hãy dùng ``configs/smoke.yaml`` để chạy thử nhanh.
#
# Chạy:  python scripts/train_rl.py --config configs/default.yaml
# =====================================================================

# --- Tái lập kết quả (reproducibility) ---
seed: 42

# --- Đường dẫn (không hardcode trong code, tất cả đọc từ đây) ---
paths:
  checkpoints: checkpoints
  logs: logs
  figures: figures
  pool: checkpoints/pool

# --- Kiến trúc mô hình ---
model:
  gnn_hidden_dim: 128
  gnn_layers: 3
  gnn_heads: 4
  motif_dim: 64
  num_motifs: 30
  policy_hidden: 512
  value_hidden: 256
  dropout: 0.1

# --- Huấn luyện PPO ---
training:
  lr: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  # Hậu pretrain: model đã biết đi cờ, tăng khám phá để tìm chiến thuật
  # thắng thay vì giữ nước hòa an toàn (draw -1.2 < loss -1 => hòa tệ hơn thua).
  # Kéo dài phase khám phá: cosine entropy 0.03 -> 0.005.
  entropy_coef: 0.03
  max_grad_norm: 0.5
  update_epochs: 4
  batch_size: 512
  total_steps: 600000
  games_per_batch: 512
  checkpoint_interval: 10000
  # auto = dùng CUDA nếu có, ngược lại CPU
  device: auto
  # Số process sinh self-play song song (bottleneck thật là CPU vì cchess pure Python).
  # 0 = tự động = os.cpu_count() - 1
  num_workers: 0
  # Dùng AMP (mixed precision) khi có CUDA
  use_amp: true
  # Kích thước batch con khi cập nhật PPO (mini-batch gradient descent)
  minibatch_size: 1024
  # Số bước giữa 2 lần snapshot model vào opponent pool
  pool_snapshot_interval: 5

# --- Môi trường ---
env:
  # Sau pretrain BC (val acc 0.137, Elo +55.8): model đã biết đi cờ, không
  # còn đi bừa. max_moves 200 là quá dài và khiến 83% ván kết thúc bằng
  # chạm trần -> học chiến lược hòa. Giảm xuống 120 để ép kết thúc nhanh
  # và giảm tỉ lệ hòa, buộc PPO học chiếu hết thay vì câu giờ.
  max_moves: 80
  perpetual_check_limit: 6
  # Lọc các nước đi tự-chiếu-tướng khỏi legal mask (đúng luật nhưng tốn CPU).
  # Bật = đúng luật; tắt = nhanh hơn nhưng chấp nhận nước hớ khi debug.
  legal_move_filter: true

# --- Phần thưởng ---
# Sửa sau vòng train 1e6 bước (xem src/training/reward.py):
#   - draw -0.1 + step_penalty 0.005: chống "kéo giờ" (cũ 91% hoà).
#   - material_coef là hệ số PHI cho potential-based shaping (không lấn terminal).
reward:
  # --- ÉP THẮNG: thua phải tệ hơn hòa, thắng phải hấp dẫn (hướng B) ---
  # ĐO ĐƯỢC Ở 3 VÒNG TRƯỚC (17/10):
  #   pretrain BC      : Elo +55.8 [12.6,79.6] | 12T/88H/0B | 0 thua
  #   +PPO draw -0.4   : Elo +17.2 [1.5,49.8]   |  6T/94H/0B  -> TỆ HƠN!
  #   draw vẫn 86-94%, avg_moves 113/120 (chạm trần) dù đã phạt hòa.
  # Nguyên nhân: draw -0.4 VẪN CÒN LỢI HƠN loss -1.0. Với max_moves chạm
  # trần, hòa luôn có sẵn -> model chọn "chơi an toàn, cầm -0.4".
  # CÔNG THỨC MỚI: hòa ≈ -1.2 (nặng hơn thua -1.0) + thắng +2.0 và step
  # penalty 0.01 => CHỈ thắng mới sinh lời. Buộc phải liều tấn công.
  win: 2.0
  loss: -1.0
  draw: -1.2
  material_coef: 0.01
  # Phạt mỗi nước để kéo dài ván tốn kém (max_moves 80 => tối đa -0.8).
  step_penalty: 0.01
  potential_gamma: 0.99

# --- Đánh giá ---
evaluation:
  num_games: 100
  engine_depth: 2
  engine_threads: 1
  elo_k: 32
  bootstrap_samples: 1000
  # Đường dẫn engine UCI/UCCI (Pikafish/Eleeye). Để rỗng => bỏ qua bài test engine.
  engine_path: ""
  engine_protocol: uci

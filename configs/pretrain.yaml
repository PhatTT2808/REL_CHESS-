seed: 42

paths:
  checkpoints: checkpoints_pretrain
  logs: logs
  figures: figures
  pool: checkpoints_pretrain/pool

model:
  gnn_hidden_dim: 128
  gnn_layers: 3
  gnn_heads: 4
  motif_dim: 64
  num_motifs: 30
  policy_hidden: 512
  value_hidden: 256
  dropout: 0.1

training:
  device: auto

pretrain:
  # Nhiều file dataset (mặc định: cả train + test ~= 128k vị trí).
  dataset_paths:
    - data/xiangqi_train.parquet
    - data/xiangqi_test.parquet
  label: best
  epochs: 8
  batch_size: 256
  lr: 0.001
  value_coef: 0.5
  val_ratio: 0.05
  # Dừng sớm nếu val acc không cải thiện sau N epoch liên tiếp (chống overfit)
  early_stop_patience: 3
  dedupe: true
  num_workers: 4
  device: auto
